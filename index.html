<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noctra Wellness | Understand Your Cravings</title>
  <meta name="description" content="Noctra Wellness helps you understand why sugar cravings happen and build healthier patterns through practical, science-informed wellness education.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f7f5ef;
      --white: #ffffff;
      --ink: #202522;
      --muted: #68706b;
      --green: #315b4d;
      --green-dark: #24463b;
      --green-light: #e4eee9;
      --line: #dfe4df;
      --soft: #eef2ee;
      --accent: #c8d8cf;
      --shadow: 0 18px 50px rgba(30, 45, 38, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1120px, 92%);
      margin: auto;
    }

    /* NAVIGATION */

    nav {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(32, 37, 34, 0.08);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo-symbol {
      width: 36px;
      height: 36px;
      border: 1.5px solid var(--green);
      border-radius: 50%;
      position: relative;
    }

    .logo-symbol::before {
      content: "";
      position: absolute;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--green);
      top: 9px;
      left: 8px;
    }

    .logo-symbol::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--cream);
      top: 7px;
      left: 14px;
    }

    .logo-text strong {
      display: block;
      font-family: "Manrope", sans-serif;
      font-size: 18px;
      letter-spacing: 2.5px;
      line-height: 1;
    }

    .logo-text span {
      display: block;
      font-size: 8px;
      letter-spacing: 3px;
      color: var(--muted);
      margin-top: 5px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
      font-size: 14px;
      color: var(--muted);
    }

    .nav-links a:hover {
      color: var(--green);
    }

    .nav-button {
      background: var(--green);
      color: white !important;
      padding: 11px 18px;
      border-radius: 8px;
      font-weight: 600;
    }

    /* HERO */

    .hero {
      padding: 95px 0 90px;
      overflow: hidden;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 0.9fr;
      gap: 70px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--green);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .eyebrow::before {
      content: "";
      width: 24px;
      height: 1px;
      background: var(--green);
    }

    h1 {
      font-family: "Manrope", sans-serif;
      font-size: clamp(44px, 6vw, 70px);
      line-height: 1.03;
      letter-spacing: -3px;
      margin-bottom: 25px;
      max-width: 650px;
    }

    .hero-copy {
      color: var(--muted);
      font-size: 18px;
      max-width: 590px;
      margin-bottom: 32px;
    }

    .hero-buttons {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 23px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      transition: 0.25s ease;
    }

    .button-primary {
      background: var(--green);
      color: white;
      box-shadow: 0 8px 20px rgba(49, 91, 77, 0.18);
    }

    .button-primary:hover {
      background: var(--green-dark);
      transform: translateY(-2px);
    }

    .button-secondary {
      color: var(--green);
    }

    .button-secondary:hover {
      transform: translateX(3px);
    }

    /* HERO VISUAL */

    .hero-visual {
      min-height: 470px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orbit {
      width: 380px;
      height: 380px;
      border: 1px solid #ccd7d1;
      border-radius: 50%;
      position: relative;
    }

    .orbit::before {
      content: "";
      position: absolute;
      width: 270px;
      height: 270px;
      border: 1px solid #d7dfda;
      border-radius: 50%;
      top: 54px;
      left: 54px;
    }

    .center-card {
      position: absolute;
      width: 185px;
      height: 185px;
      background: var(--white);
      border-radius: 50%;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 35px;
      font-family: "Manrope", sans-serif;
      font-weight: 800;
      color: var(--green);
      font-size: 18px;
      top: 97px;
      left: 97px;
      z-index: 2;
    }

    .trigger {
      position: absolute;
      background: white;
      padding: 13px 17px;
      border-radius: 10px;
      box-shadow: var(--shadow);
      font-size: 13px;
      font-weight: 700;
      z-index: 3;
    }

    .trigger small {
      display: block;
      font-size: 10px;
      color: var(--muted);
      font-weight: 400;
      margin-top: 2px;
    }

    .trigger-one {
      top: 40px;
      right: 5px;
    }

    .trigger-two {
      bottom: 65px;
      right: 10px;
    }

    .trigger-three {
      bottom: 15px;
      left: 15px;
    }

    .trigger-four {
      top: 100px;
      left: -5px;
    }

    /* TRUST STRIP */

    .trust {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 22px 0;
      background: rgba(255,255,255,0.4);
    }

    .trust-content {
      display: flex;
      justify-content: center;
      gap: 45px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
    }

    .trust-content span {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 5px;
      height: 5px;
      background: var(--green);
      border-radius: 50%;
    }

    /* SECTIONS */

    section {
      padding: 100px 0;
    }

    .section-heading {
      max-width: 650px;
      margin-bottom: 50px;
    }

    .section-heading h2 {
      font-family: "Manrope", sans-serif;
      font-size: clamp(32px, 4vw, 47px);
      line-height: 1.1;
      letter-spacing: -1.8px;
      margin-bottom: 18px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 17px;
    }

    /* PROBLEM */

    .problem-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .problem-card {
      background: white;
      padding: 30px 24px;
      border: 1px solid var(--line);
      border-radius: 12px;
      min-height: 190px;
      transition: 0.25s ease;
    }

    .problem-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow);
    }

    .problem-number {
      font-size: 11px;
      color: var(--green);
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 35px;
    }

    .problem-card h3 {
      font-family: "Manrope", sans-serif;
      font-size: 20px;
      margin-bottom: 8px;
    }

    .problem-card p {
      font-size: 13px;
      color: var(--muted);
    }

    /* APPROACH */

    .approach {
      background: var(--green);
      color: white;
    }

    .approach .section-heading p {
      color: #d9e5df;
    }

    .approach-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .approach-card {
      border-top: 1px solid rgba(255,255,255,0.3);
      padding-top: 24px;
    }

    .approach-number {
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.65;
      margin-bottom: 35px;
    }

    .approach-card h3 {
      font-family: "Manrope", sans-serif;
      font-size: 26px;
      margin-bottom: 10px;
    }

    .approach-card p {
      color: #d9e5df;
      font-size: 14px;
    }

    /* RESET SECTION */

    .reset-section {
      background: #f1f4f1;
    }

    .reset-layout {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 70px;
      align-items: start;
    }

    .reset-copy h2 {
      font-family: "Manrope", sans-serif;
      font-size: clamp(34px, 4vw, 49px);
      line-height: 1.08;
      letter-spacing: -2px;
      margin-bottom: 20px;
    }

    .reset-copy > p {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 28px;
    }

    .reset-list {
      list-style: none;
      margin-bottom: 35px;
    }

    .reset-list li {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 14px;
    }

    .check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--green-light);
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
    }

    .why-free {
      border-left: 2px solid var(--green);
      padding: 4px 0 4px 20px;
      margin-top: 35px;
    }

    .why-free h3 {
      font-family: "Manrope", sans-serif;
      font-size: 19px;
      margin-bottom: 8px;
    }

    .why-free p {
      color: var(--muted);
      font-size: 14px;
    }

    /* RESET FORM */

    .form-card {
      background: white;
      padding: 38px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }

    .form-card h3 {
      font-family: "Manrope", sans-serif;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .form-card-intro {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 25px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #3f4743;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      border: 1px solid #d7ddd9;
      border-radius: 8px;
      padding: 13px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      background: #fbfcfb;
      transition: 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--green);
      background: white;
    }

    .form-group textarea {
      min-height: 105px;
      resize: vertical;
    }

    .form-submit {
      width: 100%;
      border: none;
      cursor: pointer;
      margin-top: 4px;
    }

    .privacy {
      font-size: 10px;
      color: #89918c;
      text-align: center;
      margin-top: 13px;
    }

    /* WHY NOCTRA */

    .why-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .why-card {
      padding: 30px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .why-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--green-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--green);
      font-weight: 800;
      margin-bottom: 25px;
    }

    .why-card h3 {
      font-family: "Manrope", sans-serif;
      font-size: 21px;
      margin-bottom: 9px;
    }

    .why-card p {
      color: var(--muted);
      font-size: 14px;
    }

    /* CONTENT */

    .content-section {
      background: white;
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .content-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: var(--cream);
      transition: 0.25s ease;
    }

    .content-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow);
    }

    .content-top {
      height: 160px;
      background: var(--green-light);
      padding: 25px;
      display: flex;
      align-items: flex-end;
    }

    .content-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--green);
      font-weight: 700;
    }

    .content-body {
      padding: 24px;
    }

    .content-body h3 {
      font-family: "Manrope", sans-serif;
      font-size: 20px;
      line-height: 1.25;
      margin-bottom: 10px;
    }

    .content-body p {
      color: var(--muted);
      font-size: 13px;
    }

    /* FINAL CTA */

    .final-cta {
      padding: 105px 0;
      text-align: center;
      background: var(--cream);
    }

    .final-cta h2 {
      font-family: "Manrope", sans-serif;
      font-size: clamp(36px, 5vw, 58px);
      letter-spacing: -2px;
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .final-cta p {
      color: var(--muted);
      max-width: 570px;
      margin: 0 auto 28px;
      font-size: 16px;
    }

    /* FOOTER */

    footer {
      background: #202522;
      color: white;
      padding: 60px 0 30px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 50px;
      padding-bottom: 50px;
    }

    .footer-brand p {
      color: #aeb8b2;
      font-size: 13px;
      max-width: 330px;
      margin-top: 18px;
    }

    .footer-title {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #aeb8b2;
      margin-bottom: 17px;
    }

    .footer-links {
      display: flex;
      flex-direction: column;
      gap: 9px;
      font-size: 13px;
    }

    .footer-links a {
      color: #e2e7e4;
    }

    .footer-links a:hover {
      color: white;
    }

    .footer-bottom {
      border-top: 1px solid rgba(255,255,255,0.12);
      padding-top: 22px;
      color: #8f9993;
      font-size: 10px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    /* MOBILE */

    @media (max-width: 850px) {

      .nav-links a:not(.nav-button) {
        display: none;
      }

      .hero {
        padding: 65px 0;
      }

      .hero-grid,
      .reset-layout {
        grid-template-columns: 1fr;
      }

      .hero-grid {
        gap: 40px;
      }

      .hero-visual {
        min-height: 390px;
      }

      .orbit {
        width: 310px;
        height: 310px;
      }

      .orbit::before {
        width: 220px;
        height: 220px;
        top: 44px;
        left: 44px;
      }

      .center-card {
        width: 155px;
        height: 155px;
        top: 77px;
        left: 77px;
        font-size: 16px;
      }

      .trigger-one {
        right: -5px;
      }

      .trigger-four {
        left: -10px;
      }

      .problem-grid {
        grid-template-columns: 1fr 1fr;
      }

      .approach-grid,
      .why-grid,
      .content-grid {
        grid-template-columns: 1fr;
      }

      .reset-layout {
        gap: 40px;
      }

      .footer-grid {
        grid-template-columns: 1fr 1fr;
      }

      .footer-brand {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 560px) {

      nav {
        height: 72px;
      }

      .nav-button {
        padding: 9px 13px;
        font-size: 12px;
      }

      h1 {
        font-size: 44px;
        letter-spacing: -2px;
      }

      .hero-copy {
        font-size: 16px;
      }

      section {
        padding: 70px 0;
      }

      .problem-grid {
        grid-template-columns: 1fr;
      }

      .form-card {
        padding: 25px 20px;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .hero-visual {
        transform: scale(0.88);
        margin-left: -20px;
        margin-right: -20px;
      }

      .footer-grid {
        grid-template-columns: 1fr;
      }

      .footer-brand {
        grid-column: auto;
      }

      .footer-bottom {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->

  <div class="container">
    <nav>

      <a href="#top" class="logo">
        <div class="logo-symbol"></div>

        <div class="logo-text">
          <strong>NOCTRA</strong>
          <span>WELLNESS</span>
        </div>
      </a>

      <div class="nav-links">
        <a href="#how">How It Works</a>
        <a href="#why">Why Noctra</a>
        <a href="#reset" class="nav-button">Get the Free Reset</a>
      </div>

    </nav>
  </div>


  <!-- HERO -->

  <main id="top">

    <section class="hero">

      <div class="container">

        <div class="hero-grid">

          <div>

            <div class="eyebrow
