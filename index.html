<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noctra Wellness | Understand Your Sugar Cravings</title>

  <meta name="description" content="Meet the Noctra Craving Reset, a free PC app designed to help you pause, check in, and better understand your sugar-craving patterns.">

  <meta name="theme-color" content="#f7f5ed">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f7f5ed;
      --white: #ffffff;
      --green: #173e32;
      --green-dark: #102e26;
      --green-soft: #e6eee7;
      --mint: #dcebe0;
      --ink: #202b25;
      --muted: #68746b;
      --line: #e3e5dc;
      --yellow: #f0d78b;
      --coral: #e9a18d;
      --lavender: #e8e2f2;
      --blue: #e1eaf1;
      --shadow: 0 20px 60px rgba(29, 52, 40, 0.10);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    body, button, input, textarea {
      font-family: "DM Sans", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, textarea {
      font-size: 1rem;
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: min(1160px, calc(100% - 44px));
      margin: 0 auto;
    }

    .section {
      padding: 100px 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--green);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 22px;
      height: 2px;
      background: currentColor;
    }

    h1, h2, h3 {
      font-family: "Manrope", sans-serif;
      letter-spacing: -0.045em;
      line-height: 1.13;
    }

    h1 {
      font-size: clamp(2.8rem, 5.7vw, 5.2rem);
      font-weight: 800;
    }

    h2 {
      font-size: clamp(2.1rem, 4vw, 3.5rem);
      font-weight: 800;
    }

    h3 {
      font-size: 1.2rem;
      font-weight: 800;
    }

    p {
      color: var(--muted);
    }

    .section-heading {
      max-width: 720px;
      margin-bottom: 48px;
    }

    .section-heading h2 {
      margin: 16px 0;
    }

    .section-heading p {
      max-width: 610px;
      font-size: 1.05rem;
    }

    .center {
      text-align: center;
      margin-left: auto;
      margin-right: auto;
    }

    .center .eyebrow {
      justify-content: center;
    }

    .center p {
      margin-left: auto;
      margin-right: auto;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 14px 23px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--green);
      color: white;
      font-weight: 700;
      transition: transform 0.2s ease, background 0.2s ease;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--green-dark);
      transform: translateY(-2px);
    }

    .btn-light {
      background: white;
      color: var(--green);
    }

    .btn-light:hover {
      background: var(--green-soft);
    }

    .btn-outline {
      background: transparent;
      color: var(--green);
      border-color: #cdd6cc;
    }

    .btn-outline:hover {
      background: var(--green-soft);
    }

    .arrow {
      font-size: 1.2rem;
      line-height: 1;
    }

    /* Navigation */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(247, 245, 237, 0.94);
      border-bottom: 1px solid rgba(30, 57, 42, 0.08);
      backdrop-filter: blur(16px);
    }

    .nav-inner {
      min-height: 78px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--green);
      font-family: "Manrope", sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .brand-mark {
      width: 37px;
      height: 37px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--green);
      color: white;
      font-family: "Playfair Display", serif;
      font-size: 1.35rem;
    }

    .brand small {
      display: block;
      margin-top: -5px;
      color: var(--muted);
      font-family: "DM Sans", sans-serif;
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .nav-links > a:not(.btn) {
      color: #48564c;
      font-size: 0.91rem;
      font-weight: 600;
    }

    .nav-links > a:not(.btn):hover {
      color: var(--green);
    }

    .nav-links .btn {
      min-height: 43px;
      padding: 10px 18px;
      font-size: 0.88rem;
    }

    /* Hero */

    .hero {
      position: relative;
      overflow: hidden;
      padding: 76px 0 88px;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      right: -180px;
      top: 0;
      border-radius: 50%;
      background: #e7eddf;
      opacity: 0.7;
      filter: blur(3px);
    }

    .hero-grid {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 58px;
    }

    .hero-copy {
      position: relative;
      z-index: 2;
    }

    .hero h1 {
      margin: 22px 0;
      max-width: 620px;
    }

    .hero h1 span {
      color: #65816a;
      font-family: "Playfair Display", serif;
      font-weight: 600;
      font-style: italic;
    }

    .hero-copy > p {
      max-width: 510px;
      margin-bottom: 28px;
      font-size: 1.1rem;
      line-height: 1.8;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 23px;
    }

    .hero-note {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #69756b;
      font-size: 0.84rem;
    }

    .hero-note span {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--green-soft);
      color: var(--green);
      font-weight: 800;
    }

    /* Desktop tool mockup */

    .product-visual {
      position: relative;
      min-width: 0;
      padding: 18px 0;
    }

    .visual-orb {
      position: absolute;
      width: 350px;
      height: 350px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #e6ebdc;
    }

    .visual-label {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 4;
      padding: 10px 14px;
      border: 1px solid #e4e7dc;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 25px rgba(30, 57, 42, 0.07);
      color: var(--green);
      font-size: 0.76rem;
      font-weight: 800;
    }

    .laptop {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 540px;
      margin: 24px auto 0;
    }

    .laptop-screen {
      position: relative;
      padding: 12px;
      border: 7px solid #25332c;
      border-bottom-width: 11px;
      border-radius: 17px 17px 7px 7px;
      background: #e8eee5;
      box-shadow: var(--shadow);
    }

    .screen-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px 13px;
      color: #607067;
      font-size: 0.68rem;
    }

    .screen-dots {
      display: flex;
      gap: 5px;
    }

    .screen-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #aebbb0;
    }

    .desktop-scene {
      position: relative;
      min-height: 290px;
      overflow: hidden;
      padding: 17px;
      border-radius: 8px;
      background: linear-gradient(135deg, #dbe8dc, #e9e6d8);
    }

    .desktop-app {
      width: 58%;
      min-width: 210px;
      padding: 15px;
      border: 1px solid #e5e9e0;
      border-radius: 12px;
      background: #fffefa;
      box-shadow: 0 10px 25px rgba(28, 48, 34, 0.10);
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--green);
      font-size: 0.76rem;
      font-weight: 800;
    }

    .app-icon {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border-radius: 8px;
      background: var(--green);
      color: white;
      font-family: "Playfair Display", serif;
      font-size: 0.9rem;
    }

    .app-status {
      margin: 12px 0 8px;
      color: #829087;
      font-size: 0.63rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .desktop-app h3 {
      margin-bottom: 7px;
      font-size: 1.12rem;
    }

    .desktop-app p {
      font-size: 0.76rem;
      line-height: 1.6;
    }

    .app-prompt {
      margin-top: 13px;
      padding: 11px;
      border-radius: 9px;
      background: #edf3ec;
      color: #344a39;
      font-size: 0.76rem;
      font-weight: 600;
    }

    .app-options {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .app-options span {
      padding: 5px 8px;
      border: 1px solid #e1e7dc;
      border-radius: 7px;
      background: white;
      color: #56685a;
      font-size: 0.64rem;
    }

    .desktop-note {
      position: absolute;
      right: 16px;
      bottom: 16px;
      width: 36%;
      padding: 14px;
      border: 1px solid #e7e7dc;
      border-radius: 12px;
      background: #fffdf7;
      box-shadow: 0 12px 28px rgba(28, 48, 34, 0.12);
    }

    .notification-top {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 9px;
      color: #68776c;
      font-size: 0.61rem;
      font-weight: 700;
    }

    .notification-top span {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: var(--green);
      color: white;
      font-family: "Playfair Display", serif;
    }

    .desktop-note strong {
      display: block;
      margin-bottom: 5px;
      color: var(--ink);
      font-size: 0.79rem;
      line-height: 1.4;
    }

    .desktop-note p {
      font-size: 0.67rem;
      line-height: 1.5;
    }

    .laptop-base {
      position: relative;
      width: 112%;
      height: 13px;
      margin-left: -6%;
      border-radius: 2px 2px 14px 14px;
      background: linear-gradient(#cbd0c9, #929b93);
      box-shadow: 0 13px 23px rgba(34, 47, 37, 0.15);
    }

    .laptop-base::after {
      content: "";
      position: absolute;
      top: 0;
      left: 40%;
      width: 20%;
      height: 4px;
      border-radius: 0 0 7px 7px;
      background: #838c84;
    }

    .floating-note {
      position: absolute;
      z-index: 3;
      left: -24px;
      bottom: 37px;
      max-width: 155px;
      padding: 15px 17px;
      border-radius: 5px;
      background: var(--yellow);
      box-shadow: 0 12px 25px rgba(60, 53, 28, 0.12);
      color: #4c422a;
      font-family: "Playfair Display", serif;
      font-size: 1rem;
      line-height: 1.4;
      transform: rotate(-5deg);
    }

    .floating-note small {
      display: block;
      margin-top: 7px;
      font-family: "DM Sans", sans-serif;
      font-size: 0.65rem;
    }

    /* Trust strip */

    .trust-strip {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.4);
    }

    .trust-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      padding: 24px 0;
    }

    .trust-item {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      color: #4c5e51;
      font-size: 0.87rem;
      font-weight: 700;
      text-align: center;
    }

    .trust-item span {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      background: var(--green-soft);
      color: var(--green);
    }

    /* Understanding section */

    .problem-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .problem-card {
      min-height: 240px;
      padding: 28px;
      border: 1px solid rgba(35, 61, 43, 0.07);
      border-radius: var(--radius);
      background: white;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .problem-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow);
    }

    .card-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin-bottom: 24px;
      border-radius: 15px;
      font-size: 1.35rem;
    }

    .icon-yellow { background: #f8efcf; }
    .icon-coral { background: #f7e3db; }
    .icon-lavender { background: var(--lavender); }
    .icon-mint { background: var(--mint); }
    .icon-blue { background: var(--blue); }

    .problem-card h3 {
      margin-bottom: 11px;
    }

    .problem-card p {
      font-size: 0.93rem;
    }

    /* Dark product section */

    .product-section {
      position: relative;
      overflow: hidden;
      background: var(--green);
      color: white;
    }

    .product-section::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      top: -240px;
      right: -140px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.045);
    }

    .product-grid {
      position: relative;
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      align-items: center;
      gap: 70px;
    }

    .product-copy .eyebrow {
      color: #c7dec9;
    }

    .product-copy h2 {
      margin: 18px 0;
      color: white;
    }

    .product-copy > p {
      margin-bottom: 24px;
      color: #d1ddd3;
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .feature-list {
      display: grid;
      gap: 17px;
      margin: 26px 0 30px;
      list-style: none;
    }

    .feature-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      color: #edf2ed;
      font-size: 0.94rem;
    }

    .feature-check {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 23px;
      height: 23px;
      margin-top: 2px;
      border-radius: 50%;
      background: #d8e8d9;
      color: var(--green);
      font-size: 0.8rem;
      font-weight: 800;
    }

    .product-copy .btn {
      background: #f4f1e7;
      color: var(--green);
    }

    .product-copy .btn:hover {
      background: white;
    }

    .product-copy .fine-print {
      margin-top: 14px;
      color: #bdcec1;
      font-size: 0.77rem;
    }

    .product-preview {
      padding: 26px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.07);
    }

    .preview-window {
      overflow: hidden;
      border: 1px solid #dfe5dc;
      border-radius: 15px;
      background: #fcfcf7;
      color: var(--ink);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
    }

    .preview-titlebar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 17px;
      border-bottom: 1px solid #e7e9e1;
      background: #f4f5ee;
    }

    .preview-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--green);
      font-size: 0.81rem;
      font-weight: 800;
    }

    .preview-brand .app-icon {
      width: 28px;
      height: 28px;
    }

    .window-controls {
      display: flex;
      gap: 6px;
    }

    .window-controls span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #b6beb5;
    }

    .preview-body {
      padding: 25px;
    }

    .preview-body .app-status {
      margin-top: 0;
    }

    .preview-body h3 {
      margin-bottom: 10px;
      font-size: 1.6rem;
    }

    .preview-body > p {
      font-size: 0.89rem;
    }

    .question-box {
      margin-top: 23px;
      padding: 19px;
      border-radius: 12px;
      background: #edf3eb;
    }

    .question-box strong {
      display: block;
      margin-bottom: 13px;
      color: #2a4331;
      font-size: 0.91rem;
    }

    .choice-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice-list span {
      padding: 8px 12px;
      border: 1px solid #d8e2d6;
      border-radius: 999px;
      background: white;
      color: #526354;
      font-size: 0.77rem;
    }

    .preview-footnote {
      margin-top: 18px;
      font-size: 0.73rem !important;
      color: #7b867b !important;
    }

    .mockup-caption {
      margin-top: 15px;
      color: #d0dfd2;
      font-size: 0.74rem;
      text-align: center;
    }

    /* How it works */

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .step-card {
      position: relative;
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.68);
    }

    .step-number {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin-bottom: 25px;
      border-radius: 14px;
      background: var(--green);
      color: white;
      font-family: "Manrope", sans-serif;
      font-size: 1rem;
      font-weight: 800;
    }

    .step-card h3 {
      margin-bottom: 12px;
    }

    .step-card p {
      font-size: 0.94rem;
    }

    .step-tag {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 10px;
      border-radius: 7px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 0.73rem;
      font-weight: 700;
    }

    /* Daily life */

    .daily-section {
      background: #eeefe5;
    }

    .daily-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 70px;
    }

    .daily-copy h2 {
      margin: 17px 0;
    }

    .daily-copy > p {
      margin-bottom: 20px;
      font-size: 1.02rem;
    }

    .daily-list {
      display: grid;
      gap: 16px;
      margin-top: 25px;
    }

    .daily-item {
      display: flex;
      align-items: flex-start;
      gap: 13px;
    }

    .daily-item .card-icon {
      width: 43px;
      height: 43px;
      margin: 0;
      flex-shrink: 0;
      border-radius: 13px;
      font-size: 1.15rem;
    }

    .daily-item h3 {
      margin-bottom: 4px;
      font-size: 0.98rem;
    }

    .daily-item p {
      font-size: 0.87rem;
    }

    .reflection-card {
      padding: 38px;
      border: 1px solid #e2e4d9;
      border-radius: 28px;
      background: #fffdf6;
      box-shadow: 0 18px 45px rgba(31, 52, 37, 0.06);
    }

    .reflection-label {
      color: #748276;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .reflection-card h3 {
      margin: 13px 0 21px;
      font-size: 1.55rem;
    }

    .reflection-option {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      padding: 12px 14px;
      border: 1px solid #e7e8df;
      border-radius: 11px;
      color: #526052;
      font-size: 0.89rem;
    }

    .reflection-option span {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border-radius: 8px;
      background: #e9efe7;
      font-size: 0.85rem;
    }

    .reflection-note {
      margin-top: 21px;
      padding: 15px;
      border-left: 3px solid #8ca58c;
      background: #f0f3e9;
      color: #4f6151;
      font-family: "Playfair Display", serif;
      font-size: 1rem;
      line-height: 1.6;
    }

      padding: 85px 0;
    }

    .free-card {

      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 35px;
      padding: 45px;
      border: 1px solid #e3e5da;

      background: white;

    .free-badge {
      display: grid;
      place-items: center;
      width: 120px;
      height: 120px;
      border: 1px solid #dce6d8;
      border-radius: 50%;
      background: #edf3e8;
      color: var(--green);
      text-align: center;
      font-family: "Manrope", sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1.3;
    }

    .free-badge small {
      display: block;
      font-family: "DM Sans", sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
    }

      background: #e9eee5;

      grid-template-columns: 0.9fr 1.1fr;
      align-items: start;
      gap: 70px;
    }

      margin: 17px 0;
    }

    .request-copy > p {
      margin-bottom: 24px;
      font-size: 1.02rem;
    }

    .request-points {
      display: grid;
      gap: 15px;
      margin-top: 25px;
    }

    .request-point {

      align-items: flex-start;
      gap: 11px;
      color: #425649;
      font-size: 0.91rem;
    }

    .request-point span {

      place-items: center;
      flex-shrink: 0;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: #d3e4d3;
      color: var(--green);
      font-size: 0.75rem;
      font-weight: 800;
    }

    .form-card {
      padding: 34px;
      border: 1px solid #e2e6dc;
      border-radius: 24px;
      background: white;
      box-shadow: 0 18px 45px rgba(31, 52, 37, 0.07);
    }

    .form-card h3 {
      margin-bottom: 7px;
      font-size: 1.55rem;
    }

    .form-intro {
      margin-bottom: 25px;
      font-size: 0.88rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {

      margin-bottom: 7px;
      color: #34453a;
      font-size: 0.83rem;
      font-weight: 700;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #dfe4db;
      border-radius: 10px;
      outline: none;
      background: #fffefa;
      color: var(--ink);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: #719078;
      box-shadow: 0 0 0 3px rgba(75, 119, 83, 0.12);
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #9ba49a;
    }

    .field textarea {
      min-height: 105px;
      resize: vertical;
    }

    .optional {
      color: #839084;
      font-size: 0.76rem;
      font-weight: 500;
    }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 16px 0;
      color: #647166;
      font-size: 0.79rem;
      line-height: 1.6;
    }

    .consent input {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      margin-top: 4px;
      accent-color: var(--green);
    }

    .consent a {
      color: var(--green);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .form-card .btn {
      width: 100%;
      margin-top: 6px;
      border: 0;
    }

    .form-privacy {
      margin-top: 14px;
      font-size: 0.73rem;
      line-height: 1.6;
      text-align: center;
    }

    .form-message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.88rem;
    }

    .form-message.success {
      display: block;
      background: #e8f3e7;
      color: #24532f;
    }

    .form-message.error {
      display: block;
      background: #f9e8e4;
      color: #7b3126;
    }

    .hp-field {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    /* FAQ */

    .faq-list {
      max-width: 820px;
      margin: 0 auto;
    }

    .faq-item {
      border-bottom: 1px solid var(--line);
    }

    .faq-item:first-child {
      border-top: 1px solid var(--line);
    }

    .faq-item summary {
      position: relative;
      padding: 23px 38px 23px 0;
      color: var(--ink);
      font-family: "Manrope", sans-serif;
      font-size: 1.02rem;
      font-weight: 800;
      list-style: none;
      cursor: pointer;
    }

    .faq-item summary::-webkit-details-marker {
      display: none;
    }

    .faq-item summary::after {
      content: "+";
      position: absolute;
      right: 3px;
      top: 17px;
      color: var(--green);
      font-size: 1.6rem;
      font-weight: 400;
    }

    .faq-item[open] summary::after {
      content: "−";
    }

    .faq-item p {
      max-width: 740px;
      padding: 0 20px 23px 0;
      font-size: 0.94rem;
    }
